<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Crumb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#D97757">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crumb">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column on a solid Claude-orange canvas. Ivory cards sit on it, slate is the ink. Always orange: the system dark mode is ignored; an optional "night" skin is a manual choice in Profile. */
:root{
  --or:#D97757; --or-deep:#C15F3C; --slate:#141413; --ivory:#FAF9F5;
  --olive:#788C5D; --fig:#C46686; --sky:#6A9BCB; --kraft:#D9B99B;
  --canvas:#D97757; --card:#FAF9F5; --card2:#F0EEE6; --card3:#FFFFFF;
  --cv-t1:#141413; --cv-t2:rgba(20,20,19,.76); --cv-t3:rgba(20,20,19,.6); --cv-surf:rgba(250,249,245,.42); --cv-surf-on:#FAF9F5; --cv-hair:rgba(20,20,19,.18);
  --cd-t1:#141413; --cd-t2:#5E5D59; --cd-t3:#85837B; --cd-hair:#E8E4D8;
  --pri:#141413; --pri-t:#FAF9F5; --ac:#B4512F;
  --shadow:0 1px 0 rgba(20,20,19,.05),0 14px 30px rgba(120,45,20,.22);
  --disp:'Unbounded','Onest',system-ui,sans-serif;
  --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1);
  --t1:var(--cv-t1); --t2:var(--cv-t2); --t3:var(--cv-t3); --surf:var(--cv-surf); --surf-on:var(--cv-surf-on); --hair:var(--cv-hair);
  color-scheme:light;
}
:root[data-skin="night"]{
  --canvas:#161615; --card:#262624; --card2:#30302D; --card3:#3A3A36;
  --cv-t1:#FAF9F5; --cv-t2:#C3C1B7; --cv-t3:#948F86; --cv-surf:#262624; --cv-surf-on:#3A3A36; --cv-hair:#34332F;
  --cd-t1:#FAF9F5; --cd-t2:#C3C1B7; --cd-t3:#948F86; --cd-hair:#3B3A36;
  --pri:#D97757; --pri-t:#141413; --ac:#EC9677;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px rgba(0,0,0,.4); color-scheme:dark;
}
/* light surfaces re-map the ink */
.card,.sheet,.entry,.kpi,.dz,.item,.opt,.msg.ai,.tabbar{--t1:var(--cd-t1);--t2:var(--cd-t2);--t3:var(--cd-t3);--surf:var(--card2);--surf-on:var(--card3);--hair:var(--cd-hair);color:var(--t1)}
.card.dark{background:var(--pri);color:var(--pri-t);--t1:var(--pri-t);--t2:var(--pri-t);--t3:var(--pri-t);--surf:rgba(255,255,255,.14);--surf-on:rgba(255,255,255,.24);--hair:rgba(255,255,255,.2);border-color:transparent}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--canvas);color:var(--t1);font:15px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button,input,textarea{outline:none}
:focus-visible{outline:2.5px solid var(--t1);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:fixed;left:0;right:0;top:0;bottom:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);padding-top:env(safe-area-inset-top,0px)}
html.kb .app{bottom:auto;top:var(--vvt,0px);height:var(--vvh)}
html.kb .tabbar{display:none}
html.kb .screen.coachscreen{padding-bottom:10px}
html.kb .screen.coachscreen .chiprow{display:none}
@media (min-width:520px){body{background:var(--slate)}.app{box-shadow:0 0 0 1px rgba(255,255,255,.08)}}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-block:6px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.coachscreen{display:flex;flex-direction:column;overflow:hidden;padding-bottom:28px}
.view{animation:viewIn .55s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stag>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.stack{display:flex;flex-direction:column;gap:12px}

/* type: Unbounded for display, Onest for text */
.display{font:600 34px/1.1 var(--disp);letter-spacing:-.035em;text-wrap:balance}
.h1{font:600 25px/1.12 var(--disp);letter-spacing:-.03em}
.h2{font:600 20px/1.15 var(--disp);letter-spacing:-.025em;text-wrap:balance}
.eyebrow{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.sub{color:var(--t2);text-wrap:pretty}
.muted{color:var(--t3)}
.num{font-variant-numeric:tabular-nums}

/* surfaces */
.card{background:var(--card);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.card.soft{background:var(--surf);box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;border:0;background:var(--pri);color:var(--pri-t);font:700 16px var(--sans);letter-spacing:-.005em;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--t1);box-shadow:inset 0 0 0 1.5px var(--t1)}
.btn.sm{height:42px;width:auto;padding:0 18px;border-radius:21px;font-size:14px}
.mini{height:36px;padding:0 15px;border-radius:18px;border:0;background:var(--surf);color:var(--t1);font:600 13px var(--sans);transition:transform .15s var(--ease)}
.mini:active{transform:scale(.94)}
.mini.danger{color:var(--ac)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surf);color:var(--t1);display:grid;place-items:center;transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.9)}
.ico{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* onboarding */
.ob{flex:1;min-height:0;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.progress{flex:1;height:7px;border-radius:4px;background:var(--hair);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--t1);border-radius:4px;transition:width .6s var(--ease)}
.ob-count{font:600 12px var(--sans);color:var(--t2);min-width:34px;text-align:right}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ob-body.fwd{animation:slideF .5s var(--ease) both}
.ob-body.bwd{animation:slideB .5s var(--ease) both}
@keyframes slideF{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.ob-foot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:16px 18px;border-radius:22px;border:0;background:var(--card);box-shadow:var(--shadow);transition:background .25s var(--ease),color .25s,transform .15s var(--ease)}
.opt:active{transform:scale(.98)}
.opt .opt-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-weight:700;font-size:15.5px}
.opt small{color:var(--t3);font-size:13px;transition:color .25s}
.opt .tick{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--hair);display:grid;place-items:center;flex:none;color:transparent;transition:all .3s var(--spring)}
.opt.on{background:var(--pri);color:var(--pri-t);--t3:var(--pri-t)}
.opt.on small{opacity:.72}
.opt.on .tick{background:var(--or);box-shadow:none;color:var(--slate);transform:scale(1.08)}
.opts.grid2 .opt{padding:15px}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;height:42px;border-radius:999px;border:0;background:transparent;color:var(--t2);font:600 14px var(--sans);transition:all .25s var(--ease)}
.seg button.on{background:var(--pri);color:var(--pri-t)}
.field-l{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.field-l label{font:700 13px var(--sans);color:var(--t2)}
.big{font:600 42px/1 var(--disp);letter-spacing:-.03em}
.big small{font:600 16px var(--sans);color:var(--t2);letter-spacing:0;margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--t1) var(--p,50%),var(--hair) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--hair)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--t1)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--ivory);border:4px solid var(--slate);box-shadow:0 3px 10px rgba(20,20,19,.25);transition:transform .2s var(--ease)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ivory);border:4px solid var(--slate)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 0;color:inherit}
.sw{width:50px;height:30px;border-radius:15px;background:var(--hair);position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ivory);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch.on .sw{background:var(--pri)}
.switch.on .sw::after{transform:translateX(20px)}
.card .switch.on .sw{background:var(--or)}
.note{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:20px;background:var(--surf);font-size:13.5px;color:var(--t2)}
.note.warn{background:var(--pri);color:var(--pri-t)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:19px;border:0;background:var(--surf);color:var(--t1);font:600 13.5px var(--sans);transition:all .25s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--pri);color:var(--pri-t)}
.chip.sm{height:32px;font-size:12.5px;padding:0 13px}

/* welcome */
.welcome{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:calc(18px + 4vh) max(22px,env(safe-area-inset-right,0px)) 18px max(22px,env(safe-area-inset-left,0px))}
.lockup{display:flex;align-items:center;gap:10px;font:700 20px var(--disp);letter-spacing:-.03em}
.bul{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.bul li{display:flex;gap:12px;align-items:flex-start;color:var(--t2)}
.bul .bi{flex:none;width:36px;height:36px;border-radius:12px;background:var(--ivory);color:var(--slate);display:grid;place-items:center}
.bul b{color:var(--t1);font-weight:700}

/* analysis */
.an{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:24px max(24px,env(safe-area-inset-left,0px))}
.an-list{display:flex;flex-direction:column;gap:14px}
.an-item{display:flex;gap:12px;align-items:center;color:var(--t3);opacity:.45;transform:translateX(-6px);transition:all .5s var(--ease)}
.an-item.show{opacity:1;transform:none;color:var(--t1);font-weight:600}
.an-dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2.5px solid var(--hair);transition:all .35s var(--spring)}
.an-item.show .an-dot{border-color:var(--t1);border-top-color:transparent;animation:spin .8s linear infinite}
.an-item.done .an-dot{animation:none;border-color:var(--t1);background:var(--t1);color:var(--canvas)}
@keyframes spin{to{transform:rotate(360deg)}}

/* plan */
.kcal-hero{font:600 60px/1 var(--disp);letter-spacing:-.03em}
.kcal-hero small{font:600 18px var(--sans);color:var(--t2);letter-spacing:0;margin-left:8px}
.bar{height:9px;border-radius:5px;background:var(--surf);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;width:0;transition:width .9s var(--ease)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--t2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{width:9px;height:9px;border-radius:50%;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{padding:13px 12px;border-radius:20px;background:var(--surf)}
.fact small{display:block;color:var(--t2);font-size:12px}
.fact b{font:600 17px var(--disp);letter-spacing:-.03em}
.fact b span{font:600 12px var(--sans);color:var(--t2);margin-left:3px;letter-spacing:0}
.dots{display:flex;flex-direction:column;gap:11px;padding:0;margin:0;list-style:none}
.dots li{display:flex;gap:10px;font-size:14px;color:var(--t2)}
.dots li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--t1);margin-top:7px}

/* top bar / days */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 12px}
.top .eyebrow{display:block;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--pri);color:var(--pri-t);font:700 13px var(--sans)}
.days{display:flex;gap:4px;margin:2px 0 14px}
.day{flex:1;border:0;background:transparent;border-radius:20px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t2);transition:all .3s var(--ease)}
.day small{font-size:11.5px;font-weight:600}
.day b{font:600 15px var(--disp);color:var(--t1);letter-spacing:-.02em}
.day i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:3px;transition:background .3s}
.day.has i{background:var(--t1)}
.day.on{background:var(--ivory);color:var(--slate);box-shadow:0 8px 18px rgba(120,45,20,.25)}
.day.on b,.day.on small{color:var(--slate)}
.day.on.has i{background:var(--or)}
.day:active{transform:scale(.94)}

/* hero ring */
.hero{display:flex;flex-direction:column;gap:18px;padding:20px 16px 18px}
.ringwrap{position:relative;width:min(100%,232px);aspect-ratio:1;margin:0 auto}
.ring{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.ring-bg{stroke:var(--card2)}
.ring-fg{stroke:var(--or);transition:stroke-dashoffset 1.1s var(--ease)}
.ring-ov{stroke:var(--slate);transition:stroke-dashoffset 1.1s var(--ease)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.ringc small{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.ringc b{font:600 38px/1 var(--disp);letter-spacing:-.03em}
.ringc span{font-size:13px;color:var(--t3)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macro .mh{display:flex;flex-direction:column;gap:1px;margin-bottom:7px;font-size:12.5px;color:var(--t3)}
.macro .mh b{font:700 15px var(--sans);color:var(--t1)}
.macro .mh b small{font-weight:500;color:var(--t3);font-size:12px}

/* tape */
.tape{display:flex;height:16px;border-radius:8px;background:var(--surf);overflow:hidden;gap:2px}
.tape i{display:block;height:100%;flex:0 1 auto;border-radius:5px;transition:width .8s var(--ease)}
.tape .ml{background:var(--slate)}
.tape .sn{background:var(--or)}

/* water */
.water{display:flex;gap:16px;align-items:center}
.bottle{position:relative;width:64px;height:114px;border-radius:22px 22px 26px 26px;border:2.5px solid var(--hair);overflow:hidden;flex:none;background:var(--surf)}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky);transition:height 1.2s var(--ease)}
.wave{position:absolute;left:0;top:-11px;width:240px;height:24px;fill:var(--sky);animation:waveX 3.4s linear infinite}
@keyframes waveX{to{transform:translateX(-60px)}}
.wbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.wbody .eyebrow{display:block}
.wnum{font:600 26px/1 var(--disp);letter-spacing:-.03em}
.wnum span{font:500 14px var(--sans);color:var(--t3);margin-left:5px;letter-spacing:0}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wbtns .mini{background:rgba(106,155,203,.2)}
.wbtns .mini.undo{background:var(--surf);color:var(--t3)}

/* entries */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.entry{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.entry+.entry{margin-top:8px}
.erow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left;color:inherit}
.eicon{width:40px;height:40px;border-radius:14px;background:var(--card2);color:var(--t2);display:grid;place-items:center;flex:none}
.is-snack .eicon{background:var(--or);color:var(--slate)}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column}
.ebody b{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebody small{color:var(--t3);font-size:12.5px}
.ekcal{font:600 16px var(--disp);letter-spacing:-.03em;text-align:right}
.ekcal small{display:block;font:500 11px var(--sans);color:var(--t3);letter-spacing:0}
.edetail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.edetail>div{overflow:hidden}
.entry.open .edetail{grid-template-rows:1fr}
.emac{display:flex;gap:16px;padding:2px 14px 10px 66px;font-size:13px;color:var(--t3)}
.emac b{color:var(--t1);font-weight:700}
.eact{display:flex;gap:8px;padding:0 14px 14px 66px}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* tip */
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .bi{flex:none;width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.14);color:var(--or);display:grid;place-items:center}
.tip b{display:block;font-weight:700;margin-bottom:2px}
.tip p{font-size:14px;opacity:.86}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:13px 12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--t3);font-size:12px;margin-bottom:6px}
.kpi b{font:600 19px/1 var(--disp);letter-spacing:-.03em}
.kpi b span{font:500 11px var(--sans);color:var(--t3);margin-left:3px;letter-spacing:0}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--t3);font-size:10px}
.chart .vl{font-size:9.5px}
.chart .xl.today{fill:var(--t1);font-weight:700}
.chart .tgt{stroke:var(--t3);stroke-dasharray:4 4;stroke-width:1}
.chart .tl{font-size:10px}

/* ---------- nutrition math ---------- */
function macrosFor(kcal,p){
  const goal=p.goal==='aware'?'keep':p.goal;
  let prot=Math.round((goal==='keep'?1.4:1.8)*p.w/5)*5;
  prot=Math.min(prot,Math.round(kcal*.32/4/5)*5);
  let fat=Math.max(Math.round(kcal*.27/9/5)*5,Math.round(.7*p.w/5)*5);
  let carb=Math.round((kcal-prot*4-fat*9)/4/5)*5;
  if(carb<80){carb=80;fat=Math.max(40,Math.round((kcal-prot*4-carb*4)/9/5)*5)}
  return{p:prot,f:fat,c:carb,fiber:Math.round(14*kcal/1000),sugar:Math.round(.1*kcal/4)};
}
function computePlan(p,start){
  start=start||new Date();
  const goal=p.goal==='aware'?'keep':p.goal;
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const pal=Math.min(1.78,({sit:1.2,mix:1.32,act:1.45}[p.job]||1.2)+[0,.04,.09,.14][p.workouts||0]);
  const tdee=bmr*pal,minor=p.age<18,diff=p.tw-p.w,wk=Math.max(4,p.weeks);
  let kcal=tdee,weekly=0,weeks=null,adjusted=false;
  if(!minor&&goal==='lose'&&diff<0){
    const need=-diff;let def=need*7700/(wk*7);
    def=Math.min(def,.25*tdee,1000,.01*p.w*7700/7);
    kcal=Math.max(tdee-def,p.sex==='m'?1500:1200);
    if(kcal>tdee-60){kcal=tdee;weekly=0;weeks=null}
    else{weekly=-(tdee-kcal)*7/7700;weeks=Math.ceil(need/Math.abs(weekly));adjusted=weeks>wk+1}
  }else if(!minor&&goal==='gain'&&diff>0){
    const need=diff,sur=Math.min(need*7700/(wk*7),.18*tdee,500);
    kcal=tdee+sur;weekly=sur*7/7700;weeks=Math.ceil(need/weekly);adjusted=weeks>wk+1;
  }
  kcal=Math.round(kcal/10)*10;
  const snackShare=(p.meals>=4?.18:.12)+((p.hunger==='evening'||p.hunger==='night'||(p.snacks||[]).includes('night'))?.04:0);
  const rest=1-snackShare,two=p.meals===2;
  const split={breakfast:two?0:.28*rest,lunch:two?.5*rest:.38*rest,dinner:two?.5*rest:.34*rest,snack:snackShare};
  const water=clamp(Math.round((33*p.w+[0,150,300,450][p.workouts||0])/50)*50,1500,3600);
  const tracking=weekly!==0&&weeks;
  return Object.assign({bmr,tdee,pal,kcal,weekly,weeks,adjusted,minor,goal,split,water,
    startDate:dkey(start),startW:p.w,targetW:tracking?p.tw:p.w,
    date:dkey(addDays(start,(tracking?weeks:12)*7))},macrosFor(kcal,p));
}
function planNotes(p,pl){
  const n=[],sn=p.snacks||[],br=p.barriers||[];
  if(p.hunger==='evening'||p.hunger==='night'||sn.includes('night'))n.push(L(`Заложили вечерний резерв: ${nf(pl.kcal*pl.split.snack)} ккал на перекусы. Спланированный перекус надёжнее, чем срыв.`,`Evening reserve set: ${nf(pl.kcal*pl.split.snack)} kcal for snacks. A planned snack beats a binge.`));
  if(sn.includes('sweet'))n.push(L(`Сладкое не запрещаем: на добавленный сахар отведено до ${pl.sugar} г в день.`,`Sweets aren’t banned: up to ${pl.sugar} g of added sugar per day.`));
  if(sn.includes('coffee'))n.push(L('Кофе с сиропом и сахаром считаем отдельными записями, это самые незаметные калории.','Coffee with syrup and sugar gets its own entries: they’re the sneakiest calories.'));
  if(br.includes('rest'))n.push(L('Для ресторанов хватит фото: ИИ учтёт масло, соусы и размер порции.','For restaurants a photo is enough: AI accounts for oil, sauces and portion size.'));
  if(br.includes('noknow'))n.push(L('Калорийность видна до того, как вы добавили запись: можно поправить порцию.','You see the calories before saving: adjust the portion first.'));
  if(br.includes('forget'))n.push(L('Быстрые перекусы записываются одним касанием: глоток сока, ложка сахара, печенье.','Quick snacks log in one tap: a sip of juice, a spoon of sugar, a cookie.'));
  if(p.sleep===0)n.push(L('Мало сна усиливает аппетит, поэтому мы не режем калории агрессивно.','Short sleep boosts appetite, so we don’t cut calories aggressively.'));
  if(p.water0<=1)n.push(L(`Вода: начните с лишнего стакана в день и выходите на ${lit(pl.water)} л постепенно.`,`Water: start with one extra glass a day and work up to ${lit(pl.water)} L gradually.`));
  if(pl.minor)n.push(L('До 18 лет мы не ставим дефицит калорий: план держит вес и режим питания.','Under 18 we never set a calorie deficit: the plan holds weight and routine.'));
  return n.slice(0,5);
}

async function prepImage(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const sc=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.86));
  }catch(e){return file}
}
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(b)})}
function parseJSON(t){

  if(m){try{return JSON.parse(m[0])}catch(e){}}

}
const errCode=(status,j)=>j&&j.error==='bad_pass'?'bad_pass':(status===429||(j&&j.error==='rate_limited'))?'rate_limited':j&&j.error==='no_key'?'no_key':(j&&j.error==='timeout')?'timeout':j&&j.error==='empty'?'refused':'upstream_error';
async function gem({system,messages,image,json,signal,maxTokens,timeoutMs=45000}){
  const t0=performance.now();
  const ctl=new AbortController();let timedOut=false;
  const tm=setTimeout(()=>{timedOut=true;ctl.abort()},timeoutMs);
  if(signal)signal.addEventListener('abort',()=>ctl.abort());
  const body={system,messages,json:!!json,maxTokens};
  if(image)body.image={mime:image.type||'image/jpeg',data:await blobToB64(image)};
  let r,j={};
  try{
    r=await fetch('/api/gemini',{method:'POST',headers:{'content-type':'application/json','x-crumb-pass':getPass()},body:JSON.stringify(body),signal:ctl.signal});
    try{j=await r.json()}catch(e){}
  }catch(e){
    if(timedOut)throw{code:'timeout'};
    if(e&&e.name==='AbortError')throw{code:'cancelled'};
    throw{code:'upstream_error'};
  }finally{clearTimeout(tm)}
  if(!r.ok)throw{code:errCode(r.status,j)};
  AIDBG='ai '+Math.round(performance.now()-t0)+'ms'+(j.usage?' think '+(j.usage.thoughtsTokenCount||0)+' out '+(j.usage.candidatesTokenCount||0):'');
  return j.text;
}
// Ответ приходит кусками: текст появляется сразу, а не после полной генерации.
async function gemStream({system,messages,maxTokens,onText,timeoutMs=60000}){
  const t0=performance.now();let first=0,full='';
  const ctl=new AbortController();let timedOut=false;
  const tm=setTimeout(()=>{timedOut=true;ctl.abort()},timeoutMs);
  try{
    let r;
    try{r=await fetch('/api/gemini',{method:'POST',headers:{'content-type':'application/json','x-crumb-pass':getPass()},body:JSON.stringify({system,messages,maxTokens,stream:true}),signal:ctl.signal})}
    catch(e){throw{code:timedOut?'timeout':'upstream_error'}}
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw{code:errCode(r.status,j)}}
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    try{
      for(;;){
        const {done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});
        let i;
        while((i=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith('data:'))continue;
          const pl=line.slice(5).trim();if(!pl||pl==='[DONE]')continue;
          try{
            const d=JSON.parse(pl),parts=(d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
            const tx=parts.map(x=>x.text||'').join('');
            if(tx){if(!first)first=Math.round(performance.now()-t0);full+=tx;if(onText)onText(full)}
          }catch(e){}
        }
      }
    }catch(e){throw{code:timedOut?'timeout':'upstream_error',text:full}}
  }finally{clearTimeout(tm)}
  AIDBG='ai first '+first+'ms total '+Math.round(performance.now()-t0)+'ms';
  if(!full.trim())throw{code:'refused'};
  return full;
}
const ctxLine=()=>{const p=S.profile;return p&&p.diet&&p.diet.length&&!p.diet.includes('none')?`\nUser dietary restrictions: ${labs('diet',p.diet)}.`:''};
async function askFood(kind){
  sh.busy=true;sh.err='';paintSheet();startTicker();
  try{
    let raw;
    if(!SAMPLE&&BACKEND){
      const ctl=sh.ctl=new AbortController();
      if(kind==='photo'){
        const blob=await prepImage(sh.file);
        raw=parseJSON(await gem({system:foodRules()+ctxLine(),messages:[{role:'user',text:'The photo shows a meal. Identify the dishes and estimate portions from the size of the plate and cutlery.'}],image:blob,json:true,maxTokens:1500,signal:ctl.signal}));
      }else raw=parseJSON(await gem({system:foodRules()+ctxLine(),messages:[{role:'user',text:'Description: "'+sh.text.trim()+'"'}],json:true,maxTokens:1500,signal:ctl.signal}));
    }
    else if(!SAMPLE){await sleep(1700);raw=mockFood(sh.text);sh.demo=true}
    else{
      const ctl=sh.ctl=new AbortController();
      if(kind==='photo'){
        if(!SAMPLE_IMG)throw{code:'images_unavailable'};
        const blob=await prepImage(sh.file);
        raw=await SAMPLE.json(foodRules()+ctxLine()+'\n\nThe photo shows a meal. Identify the dishes and estimate portions from the size of the plate and cutlery.',{images:blob,modelTier:'quick',signal:ctl.signal});
      }else raw=await SAMPLE.json(foodRules()+ctxLine()+'\n\nDescription: "'+sh.text.trim()+'"',{modelTier:'quick',signal:ctl.signal});
    }
    const f=normFood(raw);
    if(!f.items.length)throw{code:'empty'};
    const t=sh.day===todayKey()?nowT():'12:00',tot=sumItems(f.items);
    sh.draft=Object.assign(f,{src:kind,t,type:guessType(tot.kcal,t)});
    sh.view='result';
  }catch(e){if(!e||e.code!=='cancelled')sh.err=aiErr(e&&e.code)||L('Не получилось оценить. Попробуйте ещё раз.','Couldn’t estimate that. Try again.')}
  finally{sh.busy=false;stopTicker();if(sh)paintSheet()}
}
async function askFix(text){
  if(!text||!text.trim()||sh.fixBusy)return;
  sh.fixBusy=true;sh.err='';paintSheet();
  try{
    let raw;
    if(!SAMPLE&&BACKEND){
      const cur={title:sh.draft.title,items:sh.draft.items.map(i=>({name:i.name,grams:Math.round(i.grams*i.s),kcal:Math.round(i.kcal*i.s),p:i.p*i.s,f:i.f*i.s,c:i.c*i.s,sugar:i.sugar*i.s,fiber:i.fiber*i.s}))};
      raw=parseJSON(await gem({system:foodRules()+ctxLine(),messages:[{role:'user',text:'Previous estimate (JSON):\n'+JSON.stringify(cur)+'\nThe user corrects it: "'+text.trim()+'"\nUpdate the estimate with the correction and return JSON in the same format. If the correction answers a question, drop that question.'}],json:true,maxTokens:1500}));
    }
    else if(!SAMPLE){await sleep(1200);raw=mockFood(text);sh.demo=true}
    else{
      const cur={title:sh.draft.title,items:sh.draft.items.map(i=>({name:i.name,grams:Math.round(i.grams*i.s),kcal:Math.round(i.kcal*i.s),p:i.p*i.s,f:i.f*i.s,c:i.c*i.s,sugar:i.sugar*i.s,fiber:i.fiber*i.s}))};
      raw=await SAMPLE.json(foodRules()+ctxLine()+'\n\nPrevious estimate (JSON):\n'+JSON.stringify(cur)+'\nThe user corrects it: "'+text.trim()+'"\nUpdate the estimate with the correction and return JSON in the same format. If the correction answers a question, drop that question.',{modelTier:'quick',cache:false});
    }
    const f=normFood(raw);
    if(!f.items.length)throw{code:'empty'};
    sh.draft=Object.assign(sh.draft,{title:f.title,items:f.items,conf:f.conf,note:f.note,questions:f.questions});
    sh.fix='';
  }catch(e){sh.err=aiErr(e&&e.code)||L('Не получилось поправить. Попробуйте ещё раз.','Couldn’t apply that. Try again.')}
  finally{sh.fixBusy=false;if(sh)paintSheet()}
}

function barsSVG(days,target){
  const W=340,H=180,top=20,bot=26,L0=4,R=4,n=days.length,step=(W-L0-R)/n,bw=Math.min(30,step*.62);
  const max=Math.max(target*1.28,...days.map(d=>d.kcal)),ch=H-top-bot,y=v=>top+ch*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Калории за неделю','Calories this week')}">`;
  s+=`<line class="tgt" x1="${L0}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}"/><text class="tl" x="${W-R}" y="${y(target)-5}" text-anchor="end">${L('норма','target')} ${nf(target)}</text>`;
  days.forEach((d,i)=>{
    const x=L0+i*step+(step-bw)/2,cx=x+bw/2,yb=H-bot;
    if(d.kcal>0){
      const ht=ch*d.kcal/max,hs=ch*d.snack/max;
      s+=`<clipPath id="bc${i}"><rect x="${x}" y="${yb-ht}" width="${bw}" height="${ht}" rx="6"/></clipPath><g clip-path="url(#bc${i})"><rect class="b-meal" x="${x}" y="${yb-ht}" width="${bw}" height="${ht}"/><rect class="b-snack" x="${x}" y="${yb-ht}" width="${bw}" height="${hs}"/></g>`;
      s+=`<text class="vl" x="${cx}" y="${yb-ht-5}" text-anchor="middle">${nf(d.kcal)}</text>`;
    }else s+=`<rect x="${x}" y="${yb-3}" width="${bw}" height="3" rx="1.5" fill="var(--hair)"/>`;
    s+=`<text class="xl ${d.today?'today':''}" x="${cx}" y="${H-8}" text-anchor="middle">${d.label}</text>`;
  });
  return s+'</svg>';
}
function trendWeekly(){
  const pts=S.weights.slice(-8);if(pts.length<3)return null;
  const t0=parseKey(pts[0].d),xs=pts.map(p=>(parseKey(p.d)-t0)/864e5),ys=pts.map(p=>p.kg),n=pts.length;
  const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
  const den=xs.reduce((a,x)=>a+(x-mx)*(x-mx),0);if(!den)return null;
  return xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/den*7;
}
function adaptSuggest(){
  const tr=trendWeekly();if(tr===null)return null;
  const P=S.plan,diff=tr-P.weekly,delta=-diff*7700/7;
  if(Math.abs(delta)<60)return{ok:true,tr};
  const floor=S.profile.sex==='m'?1500:1200;
  let d=clamp(Math.round(delta/10)*10,-150,150);
  if(P.kcal+d<floor)d=floor-P.kcal;
  return d===0?{ok:true,tr}:{ok:false,tr,d};
}
function weightSVG(){
  const P=S.plan,W=340,H=176,L0=32,R=8,T0=12,B=26;
  const start=parseKey(P.startDate),x0=day=>(parseKey(day)-start)/864e5;
  const pts=S.weights.map(w=>({x:x0(w.d),y:w.kg})).filter(p=>p.x>=0).sort((a,b)=>a.x-b.x);
  let span=Math.max(28,(parseKey(P.date)-start)/864e5);
  if(pts.length)span=Math.max(span,pts[pts.length-1].x+3);
  const ys=[P.startW,P.targetW,...pts.map(p=>p.y)],mn=Math.floor(Math.min(...ys)-1),mxv=Math.ceil(Math.max(...ys)+1);
  const X=x=>L0+(W-L0-R)*(x/span),Y=y=>T0+(H-T0-B)*(1-(y-mn)/(mxv-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Вес и план','Weight and plan')}">`;
  [mn,(mn+mxv)/2,mxv].forEach(v=>{s+=`<line class="grid" x1="${L0}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L0-6}" y="${Y(v)+3}" text-anchor="end">${nf1(v)}</text>`});
  const planEnd=Math.max(1,(parseKey(P.date)-start)/864e5);
  s+=`<line class="w-plan" x1="${X(0)}" y1="${Y(P.startW)}" x2="${X(planEnd)}" y2="${Y(P.targetW)}"/>`;
  const tx=x0(todayKey());if(tx>=0&&tx<=span)s+=`<line class="w-now" x1="${X(tx)}" x2="${X(tx)}" y1="${T0}" y2="${H-B}"/>`;
  if(pts.length>1)s+=`<polyline class="w-act" points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="w-dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3}"/>`});
  const e0=start,e1=addDays(start,Math.round(span));

  s+=`<text x="${L0}" y="${H-8}">${sd(e0)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${sd(e1)}</text>`;
  return s+'</svg>';
}

function coachCtx(){

let coachCtl=null,coachBusy=false;
async function sendCoach(text){
  text=(text||'').trim();if(!text||coachBusy)return;
  const box=$('#msgs');if(!box)return;
  coachBusy=true;
  S.chat.push({r:'u',c:text});save();
  box.insertAdjacentHTML('beforeend',`<div class="msg me">${fmtMsg(text)}</div>`);
  const b=document.createElement('div');b.className='msg ai';b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';box.appendChild(b);box.scrollTop=box.scrollHeight;
  $('#coachIn').value='';
  let ans='';
  try{
    if(!SAMPLE&&BACKEND){
      const msgs=[];S.chat.slice(-9).forEach(m=>{const role=m.r==='u'?'user':'model';if(msgs.length&&msgs[msgs.length-1].role===role)msgs[msgs.length-1].text+='\n'+m.c;else msgs.push({role,text:m.c})});
      while(msgs.length&&msgs[0].role!=='user')msgs.shift();
      ans=await gemStream({system:coachCtx(),messages:msgs,maxTokens:1024,onText:t=>{b.innerHTML=fmtMsg(t);box.scrollTop=box.scrollHeight}});
      b.innerHTML=fmtMsg(ans);
    }else if(!SAMPLE){
      await sleep(900);const tip=tipFor(todayKey()),left=S.plan.kcal-totals(todayKey()).kcal;
      ans=L(`(Демо-ответ) Осталось ${nf(Math.max(0,left))} ккал. ${tip?tip.x:''} В настоящем приложении здесь ответит ИИ с учётом вашего дневника.`,`(Demo reply) ${nf(Math.max(0,left))} kcal left. ${tip?tip.x:''} In the real app an AI will answer here using your diary.`);
      b.innerHTML=fmtMsg(ans);
    }else{
      const turns=[{role:'user',content:coachCtx()}];
      S.chat.slice(-9).forEach(m=>turns.push({role:m.r==='u'?'user':'assistant',content:m.c}));
      const fixed=[];turns.forEach(t=>{if(fixed.length&&fixed[fixed.length-1].role===t.role)fixed[fixed.length-1].content+='\n'+t.content;else fixed.push(t)});
      coachCtl=new AbortController();
      const r=await SAMPLE(fixed,{modelTier:'quick',cache:false,signal:coachCtl.signal,onText:({text})=>{b.innerHTML=fmtMsg(text);box.scrollTop=box.scrollHeight}});
      ans=r.text;b.innerHTML=fmtMsg(ans);
    }
    S.chat.push({r:'a',c:ans});save();
  }catch(e){
    b.innerHTML=fmtMsg(e&&e.text?e.text:(aiErr(e&&e.code)||L('Не получилось ответить. Попробуйте ещё раз.','Couldn’t answer. Try again.')));
    if(e&&e.text){S.chat.push({r:'a',c:e.text});save()}else{S.chat.pop();save()}
  }finally{coachBusy=false;box.scrollTop=box.scrollHeight}
}

function openSheet(init){

function closeSheet(){
  const r=$('#sheetRoot');if(!sh)return;
  stopTicker();if(sh.ctl)try{sh.ctl.abort()}catch(e){}
  const u=sh.url;sh=null;r.classList.remove('open');
  setTimeout(()=>{if(!sh){r.innerHTML='';if(u)URL.revokeObjectURL(u)}},600);
}
function bindGrab(){
  const g=$('#grab'),s=$('.sheet');if(!g)return;let y0=null,dy=0;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);s.style.transition='none'});
  g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);s.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0===null)return;y0=null;s.style.transition='';s.style.transform='';if(dy>110)closeSheet()};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
}

  if(v==='add'){Tt.textContent=L('Добавить еду','Add food');B.innerHTML=addBody();F.innerHTML=addFoot()}
  else if(v==='result'){Tt.textContent=L('Проверьте запись','Review the entry');B.innerHTML=resultBody();F.innerHTML=`<button class="btn" data-act="saveDraft" ${sh.draft.items.length?'':'disabled'}>${L('Добавить в дневник','Add to diary')}</button>`}
  else if(v==='weight'){Tt.textContent=L('Записать вес','Log weight');B.innerHTML=weightBody();F.innerHTML=`<button class="btn" data-act="saveWeight">${L('Сохранить','Save')}</button>`;$$('input[type=range]',B).forEach(syncRange)}
}
function addBody(){
  const tabs=`<div class="seg">${[['photo',L('Фото','Photo')],['text',L('Описать','Describe')],['quick',L('Быстро','Quick')]].map(t=>`<button class="${sh.tab===t[0]?'on':''}" data-act="shTab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  const err=sh.err?`<div class="err">${esc(sh.err)}</div>`:'';
  if(sh.busy){
    return tabs+(sh.tab==='photo'&&sh.url?`<div class="prev scan"><img src="${sh.url}" alt=""></div>`:`<div class="card soft stack"><div class="shimmer" style="width:70%"></div><div class="shimmer" style="width:90%"></div><div class="shimmer" style="width:55%"></div></div>`)+`<div class="status">${ico('spark',20)}<span id="tick">${T(TICKS[0])}</span></div>`;
  }
  if(sh.tab==='photo'){
    const cam=`<input class="sr" type="file" id="fCam" accept="${IMG_TYPES}" capture="environment" data-in="file"><input class="sr" type="file" id="fLib" accept="${IMG_TYPES}" data-in="file">`;
    if(sh.url)return tabs+err+`<div class="prev"><img src="${sh.url}" alt=""></div><div class="row"><label class="mini" for="fCam" style="display:inline-flex;align-items:center">${L('Переснять','Retake')}</label><label class="mini" for="fLib" style="display:inline-flex;align-items:center">${L('Другое фото','Another photo')}</label></div>`+cam;
    return tabs+err+`<div class="dz"><span class="bi">${ico('camera',26)}</span><b>${L('Сфотографируйте еду','Photograph your food')}</b><p class="sub" style="font-size:14px">${L('ИИ оценит блюда и порции, а о неясном спросит.','AI estimates dishes and portions and asks about the unclear parts.')}</p><div class="row" style="margin-top:6px"><label class="btn sm" for="fCam" style="cursor:pointer">${ico('camera',16)}${L('Камера','Camera')}</label><label class="btn sm ghost" for="fLib" style="cursor:pointer">${ico('image',16)}${L('Галерея','Gallery')}</label></div></div>`+((SAMPLE||BACKEND)?'':'<div class="note">'+ico('info',18)+'<span>'+L('Вне Claude распознавание показывает пример ответа.','Outside Claude the recognition shows a sample reply.')+'</span></div>')+cam;
  }
  if(sh.tab==='text'){
    const ex=en()?['a handful of nuts and an apple','coffee with syrup','two cookies with tea']:['горсть орехов и яблоко','кофе с сиропом','два печенья к чаю'];
    return tabs+err+`<textarea class="txt" id="txt" data-in="txt" placeholder="${L('Например: латте с двумя ложками сахара и круассан','E.g. a latte with two spoons of sugar and a croissant')}" aria-label="${L('Что вы съели','What you ate')}">${esc(sh.text)}</textarea><div class="chiprow">${ex.map(s=>`<button class="chip sm" data-act="ex" data-t="${s}">${s}</button>`).join('')}</div>`;
  }
  const rc=recent(),u=U();
  return tabs+`<p class="sub" style="font-size:14px">${L('Одно касание — и запись готова. Окно остаётся открытым, добавляйте сколько нужно.','One tap and it’s logged. The window stays open, add as many as you need.')}</p><div class="qgrid">${QUICK.map((q,i)=>`<button class="q" data-act="quick" data-i="${i}"><b>${T(q[0])}</b><small>${q[1]} ${u.kcal}</small></button>`).join('')}</div>`+(rc.length?`<span class="eyebrow">${L('Недавнее','Recent')}</span><div class="chiprow">${rc.map(e=>`<button class="chip sm" data-act="again" data-id="${e.id}">${esc(e.title)} · ${nf(e.kcal)}</button>`).join('')}</div>`:'');
}
function addFoot(){
  if(sh.busy)return`<button class="btn ghost" data-act="cancelAI">${L('Отменить','Cancel')}</button>`;
  if(sh.tab==='photo')return sh.url?`<button class="btn" data-act="analyze" data-kind="photo">${ico('spark',18)}${L('Распознать','Recognize')}</button>`:'';
  if(sh.tab==='text')return`<button class="btn" data-act="analyze" data-kind="text">${ico('spark',18)}${L('Оценить','Estimate')}</button>`;
  return`<button class="btn ghost" data-act="closeSheet">${L('Готово','Done')}${sh.added?L(' · добавлено '+sh.added,' · added '+sh.added):''}</button>`;
}
function resultBody(){
  const d=sh.draft,tot=sumItems(d.items),u=U();
  return`<div><input class="title-in" id="dTitle" data-in="title" value="${esc(d.title)}" aria-label="${L('Название','Name')}"></div>
  <div class="tot num"><b>${nf(tot.kcal)}<small>${u.kcal}</small></b><span class="conf"><span>${L('точность','confidence')}</span><i style="--c:${Math.round(d.conf*100)}%"></i></span></div>
  <div class="macros num" style="grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px">${[[L('Белки','Protein'),tot.p],[L('Жиры','Fat'),tot.f],[L('Углеводы','Carbs'),tot.c],[L('Сахар','Sugar'),tot.sugar]].map(m=>`<div class="fact" style="padding:9px 10px"><small>${m[0]}</small><b style="font-size:15px">${nf(m[1])}<span>${u.g}</span></b></div>`).join('')}</div>
  ${sh.demo?`<div class="note">${ico('info',18)}<span>${L('Это пример ответа: ИИ работает, когда прототип открыт внутри Claude.','This is a sample reply: AI works when the prototype is open inside Claude.')}</span></div>`:''}
  ${sh.err?`<div class="err">${esc(sh.err)}</div>`:''}
  ${d.note?`<div class="note">${ico('spark',18)}<span>${esc(d.note)}</span></div>`:''}
  <div class="stack" style="gap:8px">${d.items.map((it,i)=>`<div class="item"><div class="it"><b>${esc(it.name)}</b><small class="num">${it.grams?nf(it.grams*it.s)+' '+u.g+' · ':''}${L('Б','P')} ${nf(it.p*it.s)} · ${L('Ж','F')} ${nf(it.f*it.s)} · ${L('У','C')} ${nf(it.c*it.s)}</small></div><div class="stp num"><button data-act="itemMinus" data-i="${i}" aria-label="${L('Меньше','Less')}">−</button><b>${nf(it.kcal*it.s)}</b><button data-act="itemPlus" data-i="${i}" aria-label="${L('Больше','More')}">+</button><button data-act="itemDel" data-i="${i}" aria-label="${L('Убрать','Remove')}" style="background:transparent;color:var(--t3)">${ico('x',16)}</button></div></div>`).join('')}</div>
  ${d.questions.map((q,qi)=>`<div class="qa"><b>${esc(q.q)}</b><div class="chiprow">${q.options.map(o=>`<button class="chip sm" data-act="answerQ" data-q="${qi}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
  <div><span class="eyebrow">${L('Что-то не так?','Something off?')}</span><div class="fix" style="margin-top:8px"><input id="fixIn" data-in="fix" value="${esc(sh.fix)}" placeholder="${L('Например: без сыра, съел половину','E.g. no cheese, ate half')}" aria-label="${L('Поправка','Correction')}" ${sh.fixBusy?'disabled':''}><button class="send" data-act="applyFix" aria-label="${L('Пересчитать','Recalculate')}" ${sh.fixBusy?'disabled':''}>${sh.fixBusy?'<span class="typing"><i></i><i></i><i></i></span>':ico('send',20)}</button></div></div>
  <div><span class="eyebrow">${L('Тип приёма','Meal type')}</span><div class="chiprow" style="margin-top:8px">${Object.keys(TYPES).map(t=>`<button class="chip sm ${d.type===t?'on':''}" data-act="setType" data-t="${t}">${T(TYPES[t].label)}</button>`).join('')}</div></div>
  <div class="row between"><span class="eyebrow">${L('Время','Time')}</span><input class="timein" type="time" id="dTime" data-in="time" value="${d.t}" aria-label="${L('Время','Time')}"></div>`;
}
function weightBody(){
  const last=S.weights.length?S.weights[S.weights.length-1].kg:S.profile.w;
  if(sh.wv===undefined)sh.wv=last;
  return`<div><div class="big num"><span id="v-wv">${nf1(sh.wv)}</span><small>${U().kg}</small></div><input type="range" id="r-wv" data-in="range" data-key="wv" min="${Math.max(30,Math.round(last-15))}" max="${Math.round(last+15)}" step="0.1" value="${sh.wv}"></div><p class="sub" style="font-size:14px">${L('Взвешивайтесь утром, после туалета, до еды. Важен тренд, а не отдельное число.','Weigh in the morning, after the bathroom, before eating. The trend matters, not a single number.')}</p>`;
}

/* ---------- actions ---------- */
const NUMKEYS=['workouts','sleep','stress','meals','water0'];
const ACT={
 savePass(){const v=(($('#passIn')||{}).value||'').trim();try{localStorage.setItem('crumb-pass',v)}catch(e){}toast(L('Код сохранён','Code saved'))},
 lang(t){S.lang=t.dataset.val==='en'?'en':'ru';save();confirmReset=false;if(sh)closeSheet();render()},
 obStart(){ob={step:'welcome'};D=newD();obNext()},
 obDemo(){loadDemo();ob=null;nav={tab:'home',day:todayKey()};render()},
 obNext(){obNext()},obBack(){obBack()},obFinish(){finishOb()},
 pick(t){
   const key=t.dataset.key;let val=t.dataset.val;if(NUMKEYS.includes(key))val=+val;
   if(t.dataset.multi){
     const a=D[key],i=a.indexOf(val);
     if(i>=0)a.splice(i,1);
     else{if(val==='none')a.length=0;else{const n=a.indexOf('none');if(n>=0)a.splice(n,1)}a.push(val)}
   }else D[key]=val;
   $$(`[data-key="${key}"][data-act="pick"]`).forEach(b=>{const bv=NUMKEYS.includes(key)?+b.dataset.val:b.dataset.val;b.classList.toggle('on',t.dataset.multi?D[key].includes(bv):String(D[key])===String(bv))});
   const n=$('#obNext');if(n)n.disabled=!canNext();
 },
 health(t){D.health=!D.health;t.classList.toggle('on',D.health)},
 go(t){nav.tab=t.dataset.tab;confirmReset=false;renderTabs();renderMain({})},
 add(){openSheet({tab:'photo'})},
 addSnack(){openSheet({tab:'quick'})},
 day(t){nav.day=t.dataset.k;renderMain({keep:true})},
 water(t){
   const ml=+t.dataset.ml,d=dayObj(nav.day);d.water=Math.max(0,d.water+ml);save();
   renderMain({keep:true});if(ml>0){const w=$('.bt.w');if(w)w.classList.add('pulse')}
 },
 toggleEntry(t){const e=$('#e-'+t.dataset.id);if(e)e.classList.toggle('open')},
 repeat(t){
   const e=dayObj(nav.day).entries.find(x=>x.id===t.dataset.id);if(!e)return;
   addEntry(nav.day,Object.assign({},e,{id:undefined,t:nav.day===todayKey()?nowT():e.t}));
   toast(L('Записано ещё раз · '+nf(e.kcal)+' ккал','Logged again · '+nf(e.kcal)+' kcal'));renderMain({keep:true});
 },
 delEntry(t){const d=dayObj(nav.day);d.entries=d.entries.filter(x=>x.id!==t.dataset.id);save();toast(L('Запись удалена','Entry deleted'));renderMain({keep:true})},
 closeSheet(){closeSheet()},
 shTab(t){if(sh.busy)return;sh.tab=t.dataset.tab;sh.err='';paintSheet()},
 ex(t){sh.text=t.dataset.t;paintSheet();const x=$('#txt');if(x)x.focus()},
 analyze(t){
   if(sh.busy)return;
   if(t.dataset.kind==='text'&&!sh.text.trim()){sh.err=L('Опишите, что вы съели.','Describe what you ate.');paintSheet();return}
   askFood(t.dataset.kind);
 },
 cancelAI(){if(sh.ctl)try{sh.ctl.abort()}catch(e){}sh.busy=false;stopTicker();paintSheet()},
 quick(t){
   const q=QUICK[+t.dataset.i],tm=sh.day===todayKey()?nowT():'12:00',nm=T(q[0]);
   addEntry(sh.day,{t:tm,type:'snack',title:nm,kcal:q[1],p:q[2],f:q[3],c:q[4],sugar:q[5],fiber:0,src:'quick'});
   sh.added++;t.classList.remove('added');void t.offsetWidth;t.classList.add('added');
   toast(L('Записано: '+nm+' · '+q[1]+' ккал','Logged: '+nm+' · '+q[1]+' kcal'));const f=$('#shFoot');if(f)f.innerHTML=addFoot();renderMain({keep:true});
 },
 again(t){
   const src=recent().find(x=>x.id===t.dataset.id);if(!src)return;
   addEntry(sh.day,Object.assign({},src,{id:undefined,t:sh.day===todayKey()?nowT():src.t}));
   sh.added++;toast(L('Записано: ','Logged: ')+src.title);const f=$('#shFoot');if(f)f.innerHTML=addFoot();renderMain({keep:true});
 },
 itemMinus(t){const it=sh.draft.items[+t.dataset.i];it.s=Math.max(.1,Math.round((it.s-.1)*10)/10);paintSheet()},
 itemPlus(t){const it=sh.draft.items[+t.dataset.i];it.s=Math.min(5,Math.round((it.s+.1)*10)/10);paintSheet()},
 itemDel(t){sh.draft.items.splice(+t.dataset.i,1);paintSheet()},
 setType(t){sh.draft.type=t.dataset.t;paintSheet()},
 answerQ(t){const q=sh.draft.questions[+t.dataset.q];askFix(q.q+' '+t.dataset.o)},
 applyFix(){askFix(sh.fix)},
 saveDraft(){
   const d=sh.draft,tot=sumItems(d.items);if(!d.items.length)return;
   addEntry(sh.day,{t:d.t||nowT(),type:d.type,title:d.title||L('Приём пищи','Meal'),kcal:Math.round(tot.kcal),p:Math.round(tot.p),f:Math.round(tot.f),c:Math.round(tot.c),sugar:Math.round(tot.sugar),fiber:Math.round(tot.fiber),src:d.src});
   const msg=L(T(TYPES[d.type].label)+' записан · '+nf(tot.kcal)+' ккал',T(TYPES[d.type].label)+' logged · '+nf(tot.kcal)+' kcal');const dayK=sh.day;closeSheet();nav.tab='home';nav.day=dayK||nav.day;renderTabs();renderMain({keep:false});toast(msg);
 },
 weightOpen(){openSheet({view:'weight'})},
 saveWeight(){
   const kg=Math.round(sh.wv*10)/10,k=todayKey();
   S.weights=S.weights.filter(w=>w.d!==k);S.weights.push({d:k,kg});S.weights.sort((a,b)=>a.d.localeCompare(b.d));S.profile.w=kg;save();
   closeSheet();renderMain({keep:true});toast(L('Вес записан: '+nf1(kg)+' кг','Weight logged: '+nf1(kg)+' kg'));
 },
 applyAdapt(t){
   const d=+t.dataset.d;S.plan.kcal+=d;Object.assign(S.plan,macrosFor(S.plan.kcal,S.profile));save();
   renderMain({keep:true});toast(L('Норма обновлена: '+nf(S.plan.kcal)+' ккал','Target updated: '+nf(S.plan.kcal)+' kcal'));
 },
 sugg(t){sendCoach(t.dataset.t)},
 theme(t){S.theme=t.dataset.val==='night'?'night':'orange';save();applyTheme();renderMain({keep:true})},
 rem(t){S.rem[t.dataset.k]=!S.rem[t.dataset.k];save();t.classList.toggle('on',S.rem[t.dataset.k])},
 redo(){S.onboarded=false;ob=null;D=Object.assign(newD(),JSON.parse(JSON.stringify(S.profile||{})));D.snacks=D.snacks||[];D.diet=D.diet||[];D.barriers=D.barriers||[];save();render()},
 demo(){loadDemo();nav={tab:'home',day:todayKey()};render()},
 resetAsk(){confirmReset=!confirmReset;renderMain({keep:true})},
 resetDo(){const th=S.theme,lg=S.lang;S=blank();S.theme=th;S.lang=lg;save();confirmReset=false;ob=null;D=null;nav={tab:'home',day:todayKey()};render()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='FORM')return;
  const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-act-submit]');if(!f)return;e.preventDefault();
  if(f.dataset.actSubmit==='send'){const i=$('#coachIn');sendCoach(i?i.value:'')}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='range'){
    const key=t.dataset.key,v=+t.value;syncRange(t);
    if(key==='wv'){sh.wv=v;const el=$('#v-wv');if(el)el.textContent=nf1(v);return}
    D[key]=v;const el=$('#v-'+key);if(el)el.textContent=key==='w'||key==='tw'?nf1(v):v;
    if(key==='h'||key==='w'){const b=$('#bmi');if(b)b.textContent=bmiText()}
    if(key==='tw'||key==='weeks'){const p=$('#pace');if(p)p.innerHTML=paceText()}
  }else if(k==='txt'){sh.text=t.value;sh.err=''}
  else if(k==='fix'){sh.fix=t.value}
  else if(k==='title'){sh.draft.title=t.value}
  else if(k==='time'){sh.draft.t=t.value}
  else if(k==='coach'){t.style.height='auto';t.style.height=Math.min(110,t.scrollHeight)+'px'}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||t.dataset.in!=='file')return;
  const f=t.files&&t.files[0];if(!f||!sh)return;
  if(sh.url)URL.revokeObjectURL(sh.url);
  sh.file=f;sh.url=URL.createObjectURL(f);sh.err='';paintSheet();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='fixIn'){e.preventDefault();askFix(sh.fix)}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='coachIn'){e.preventDefault();sendCoach(e.target.value)}
  if(e.key==='Escape'&&sh)closeSheet();
});

render();
initSync();
})();
</script>

</body>
</html>
